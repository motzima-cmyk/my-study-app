name: Build Android APK, Windows EXE & iPad IPA Installers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1) 갤럭시 탭 / 안드로이드용 .apk 설치 파일 자동 생성
  build-android-apk:
    name: "📦 1. 갤럭시 탭용 APK 설치파일 생성"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Auto-Detect Project & Build Release APK
        shell: bash
        run: |
          set -e
          PUBSPEC_PATH="$(find . -maxdepth 4 -name 'pubspec.yaml' -not -path '*/.*' | head -n 1)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml 파일을 저장소에서 찾을 수 없습니다."
            ls -la
            exit 1
          fi
          SRC_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "✅ pubspec.yaml 발견: $PUBSPEC_PATH (기준 폴더: $SRC_DIR)"

          if [ -f "$SRC_DIR/lib/main.dart" ]; then
            echo "✅ 이미 조립된 Flutter 프로젝트($SRC_DIR)를 그대로 사용합니다."
            cd "$SRC_DIR"
            if [ ! -d "android" ]; then
              flutter create --org com.studynote --platforms=android .
            fi
          else
            echo "🛠️ 낱개 소스 파일 폴더($SRC_DIR)에서 임시 앱 폴더를 조립합니다."
            BUILD_DIR="$GITHUB_WORKSPACE/__build_android_app"
            rm -rf "$BUILD_DIR"
            flutter create --org com.studynote --platforms=android "$BUILD_DIR"
            cp -f "$SRC_DIR/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"
            for f in main.dart adaptive_study_workspace.dart study_models.dart study_services.dart study_sync_repository.dart study_workspace_widgets.dart real_device_audio_adapter.dart; do
              if [ -f "$SRC_DIR/$f" ]; then
                cp -f "$SRC_DIR/$f" "$BUILD_DIR/lib/$f"
              fi
            done
            if [ -f "$SRC_DIR/MainActivity.kt" ]; then
              mkdir -p "$BUILD_DIR/android/app/src/main/kotlin/com/studynote/study_note_app"
              cp -f "$SRC_DIR/MainActivity.kt" "$BUILD_DIR/android/app/src/main/kotlin/com/studynote/study_note_app/MainActivity.kt"
            fi
            cd "$BUILD_DIR"
          fi

          flutter pub get
          flutter build apk --release
          cp -f build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/StudyNote_Android_Tablet.apk"
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-Android-APK-설치파일
          path: StudyNote_Android_Tablet.apk

  # 2) 윈도우 PC용 .exe 실행 파일 패키지 자동 생성
  build-windows-exe:
    name: "💻 2. 윈도우 PC용(.exe) 프로그램 생성"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Auto-Detect Project & Build Windows EXE
        shell: bash
        run: |
          set -e
          PUBSPEC_PATH="$(find . -maxdepth 4 -name 'pubspec.yaml' -not -path '*/.*' | head -n 1)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml 파일을 저장소에서 찾을 수 없습니다."
            ls -la
            exit 1
          fi
          SRC_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "✅ pubspec.yaml 발견: $PUBSPEC_PATH (기준 폴더: $SRC_DIR)"

          if [ -f "$SRC_DIR/lib/main.dart" ]; then
            echo "✅ 이미 조립된 Flutter 프로젝트($SRC_DIR)를 그대로 사용합니다."
            cd "$SRC_DIR"
            if [ ! -d "windows" ]; then
              flutter create --org com.studynote --platforms=windows .
            fi
          else
            echo "🛠️ 낱개 소스 파일 폴더($SRC_DIR)에서 임시 앱 폴더를 조립합니다."
            BUILD_DIR="$GITHUB_WORKSPACE/__build_windows_app"
            rm -rf "$BUILD_DIR"
            flutter create --org com.studynote --platforms=windows "$BUILD_DIR"
            cp -f "$SRC_DIR/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"
            for f in main.dart adaptive_study_workspace.dart study_models.dart study_services.dart study_sync_repository.dart study_workspace_widgets.dart real_device_audio_adapter.dart; do
              if [ -f "$SRC_DIR/$f" ]; then
                cp -f "$SRC_DIR/$f" "$BUILD_DIR/lib/$f"
              fi
            done
            cd "$BUILD_DIR"
          fi

          flutter pub get
          flutter build windows --release
          rm -rf "$GITHUB_WORKSPACE/StudyNote_Windows_Release"
          cp -r build/windows/x64/runner/Release "$GITHUB_WORKSPACE/StudyNote_Windows_Release"
      - name: Upload Windows EXE Folder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-Windows-EXE-실행프로그램
          path: StudyNote_Windows_Release/

  # 3) 아이패드용 .ipa 파일 자동 생성 (윈도우 Sideloadly 프로그램으로 아이패드에 바로 넣기용)
  build-ipad-ipa:
    name: "🍎 3. 아이패드용 IPA 설치파일 생성 (Sideloadly용)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Auto-Detect Project & Build Unsigned iPad IPA
        shell: bash
        run: |
          set -e
          PUBSPEC_PATH="$(find . -maxdepth 4 -name 'pubspec.yaml' -not -path '*/.*' | head -n 1)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml 파일을 저장소에서 찾을 수 없습니다."
            ls -la
            exit 1
          fi
          SRC_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "✅ pubspec.yaml 발견: $PUBSPEC_PATH (기준 폴더: $SRC_DIR)"

          if [ -f "$SRC_DIR/lib/main.dart" ]; then
            echo "✅ 이미 조립된 Flutter 프로젝트($SRC_DIR)를 그대로 사용합니다."
            cd "$SRC_DIR"
            if [ ! -d "ios" ]; then
              flutter create --org com.studynote --platforms=ios .
            fi
          else
            echo "🛠️ 낱개 소스 파일 폴더($SRC_DIR)에서 임시 앱 폴더를 조립합니다."
            BUILD_DIR="$GITHUB_WORKSPACE/__build_ios_app"
            rm -rf "$BUILD_DIR"
            flutter create --org com.studynote --platforms=ios "$BUILD_DIR"
            cp -f "$SRC_DIR/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"
            for f in main.dart adaptive_study_workspace.dart study_models.dart study_services.dart study_sync_repository.dart study_workspace_widgets.dart real_device_audio_adapter.dart; do
              if [ -f "$SRC_DIR/$f" ]; then
                cp -f "$SRC_DIR/$f" "$BUILD_DIR/lib/$f"
              fi
            done
            if [ -f "$SRC_DIR/AppDelegate.swift" ]; then
              cp -f "$SRC_DIR/AppDelegate.swift" "$BUILD_DIR/ios/Runner/AppDelegate.swift"
            fi
            cd "$BUILD_DIR"
          fi

          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '강의 음성을 녹음하고 필기 타임스탬프와 동기화하기 위해 마이크 권한이 필요합니다.'" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsFullAccessUsageDescription string 'AI 스터디 플래너 일정을 캘린더에 등록하기 위해 권한이 필요합니다.'" ios/Runner/Info.plist 2>/dev/null || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 1[1234]\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

          flutter pub get
          if [ -f "ios/Podfile" ]; then
            sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" ios/Podfile || true
            sed -i '' "s/platform :ios, '1[1234]\.0'/platform :ios, '15.0'/g" ios/Podfile || true
          fi
          flutter build ios --release --no-codesign
          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/StudyNote_iPad_Sideloadly.ipa" Payload
      - name: Upload iPad IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-iPad-IPA-설치파일(Sideloadly용)
          path: StudyNote_iPad_Sideloadly.ipa
