                      continue
                  if code[i:i+3] in ("'''", '"""'):
                      q3 = code[i:i+3]; out.append(q3); i += 3
                      while i < n and code[i:i+3] != q3:
                          if code[i] == '\\' and i + 1 < n:
                              out.append(code[i:i+2]); i += 2
                          else:
                              out.append(code[i]); i += 1
                      if i < n:
                          out.append(q3); i += 3
                      continue
                  if ch in ("'", '"'):
                      q = ch; out.append(q); i += 1; interp = 0
                      while i < n:
                          if code[i] == '\\' and i + 1 < n:
                              out.append(code[i:i+2]); i += 2; continue
                          if code[i:i+2] == '${':
