                  if code[i:i+2] == '/*':
                      end = code.find('*/', i + 2)
                      if end == -1:
                          out.append(code[i:]); break
                      out.append(code[i:end+2]); i = end + 2; continue
                  if ch == 'r' and i + 1 < n and code[i+1] in ("'", '"'):
