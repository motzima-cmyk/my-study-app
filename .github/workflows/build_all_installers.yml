name: Build Android APK, Windows EXE & iPad IPA Installers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1) 갤럭시 탭 / 안드로이드용 .apk 설치 파일 자동 생성
  build-android-apk:
    name: "📦 1. 갤럭시 탭용 APK 설치파일 생성"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Auto-Detect Project, Repair Strings & Build Release APK
        shell: bash
        run: |
          set -e
          PUBSPEC_PATH="$(find . -maxdepth 4 -name 'pubspec.yaml' -not -path '*/.*' | head -n 1)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml 파일을 저장소에서 찾을 수 없습니다."
            exit 1
          fi
          SRC_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "✅ pubspec.yaml 발견: $PUBSPEC_PATH"

          if [ -f "$SRC_DIR/lib/main.dart" ]; then
            cd "$SRC_DIR"
            [ ! -d "android" ] && flutter create --org com.studynote --platforms=android .
          else
            BUILD_DIR="$GITHUB_WORKSPACE/__build_android_app"
            rm -rf "$BUILD_DIR"
            flutter create --org com.studynote --platforms=android "$BUILD_DIR"
            cp -f "$SRC_DIR/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"
            for f in main.dart adaptive_study_workspace.dart study_models.dart study_services.dart study_sync_repository.dart study_workspace_widgets.dart real_device_audio_adapter.dart; do
              [ -f "$SRC_DIR/$f" ] && cp -f "$SRC_DIR/$f" "$BUILD_DIR/lib/$f"
            done
            if [ -f "$SRC_DIR/MainActivity.kt" ]; then
              mkdir -p "$BUILD_DIR/android/app/src/main/kotlin/com/studynote/study_note_app"
              cp -f "$SRC_DIR/MainActivity.kt" "$BUILD_DIR/android/app/src/main/kotlin/com/studynote/study_note_app/MainActivity.kt"
            fi
            cd "$BUILD_DIR"
          fi

          python3 - << 'PYEOF'
          import glob, os

          def repair_dart(code):
              out = []
              i, n, fixes = 0, len(code), 0
              while i < n:
                  ch = code[i]
                  if code[i:i+2] == '//':
                      end = code.find('\n', i)
                      if end == -1:
                          out.append(code[i:]); break
                      out.append(code[i:end+1]); i = end + 1; continue
                  if code[i:i+2] == '/*':
                      end = code.find('*/', i + 2)
                      if end == -1:
                          out.append(code[i:]); break
                      out.append(code[i:end+2]); i = end + 2; continue
                  if ch == 'r' and i + 1 < n and code[i+1] in ("'", '"'):
                      q = code[i+1]
                      if code[i+1:i+4] == q * 3:
                          end = code.find(q * 3, i + 4)
                          if end == -1:
                              out.append(code[i:]); break
                          out.append(code[i:end+3]); i = end + 3; continue
                      out.append('r' + q); i += 2
                      while i < n and code[i] != q:
                          if code[i] == '\r' and i + 1 < n and code[i+1] == '\n':
                              out.append('\\n'); fixes += 1; i += 2
                          elif code[i] == '\n':
                              out.append('\\n'); fixes += 1; i += 1
                          else:
                              out.append(code[i]); i += 1
                      if i < n:
                          out.append(code[i]); i += 1
                      continue
                  if code[i:i+3] in ("'''", '"""'):
                      q3 = code[i:i+3]; out.append(q3); i += 3
                      while i < n and code[i:i+3] != q3:
                          if code[i] == '\\' and i + 1 < n:
                              out.append(code[i:i+2]); i += 2
                          else:
                              out.append(code[i]); i += 1
                      if i < n:
                          out.append(q3); i += 3
                      continue
                  if ch in ("'", '"'):
                      q = ch; out.append(q); i += 1; interp = 0
                      while i < n:
                          if code[i] == '\\' and i + 1 < n:
                              out.append(code[i:i+2]); i += 2; continue
                          if code[i:i+2] == '${':
                              interp += 1; out.append('${'); i += 2; continue
                          if interp > 0:
                              if code[i] == '{': interp += 1
                              elif code[i] == '}': interp -= 1
                              out.append(code[i]); i += 1; continue
                          if code[i] == q:
                              out.append(q); i += 1; break
                          if code[i] == '\r' and i + 1 < n and code[i+1] == '\n':
                              out.append('\\n'); fixes += 1; i += 2; continue
                          if code[i] == '\n':
                              out.append('\\n'); fixes += 1; i += 1; continue
                          out.append(code[i]); i += 1
                      continue
                  out.append(ch); i += 1
              return ''.join(out), fixes

          for path in glob.glob('lib/**/*.dart', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  src = f.read()
              fixed, cnt = repair_dart(src)
              imp_fixed = fixed.replace(
                  'package:syncfusion_flutter_pdfviewer/syncfusion_flutter_pdfviewer.dart',
                  'package:syncfusion_flutter_pdfviewer/pdfviewer.dart',
              )
              if cnt > 0 or imp_fixed != fixed:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(imp_fixed)
                  print(f"🔧 자동 복구 완료: {path} (줄바꿈 {cnt}곳, pdfviewer import 교정={imp_fixed != fixed})")
          PYEOF

          flutter pub get
          flutter build apk --release
          cp -f build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/StudyNote_Android_Tablet.apk"
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-Android-APK-설치파일
          path: StudyNote_Android_Tablet.apk

  # 2) 윈도우 PC용 .exe 실행 파일 패키지 자동 생성
  build-windows-exe:
