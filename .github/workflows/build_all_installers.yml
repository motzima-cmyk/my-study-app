  # 3) 아이패드용 .ipa 파일 자동 생성 (윈도우 Sideloadly 프로그램으로 아이패드에 바로 넣기용)
  build-ipad-ipa:
    name: "🍎 3. 아이패드용 IPA 설치파일 생성 (Sideloadly용)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Auto-Detect Project, Repair Strings & Build Unsigned iPad IPA
        shell: bash
        run: |
          set -e
          PUBSPEC_PATH="$(find . -maxdepth 4 -name 'pubspec.yaml' -not -path '*/.*' | head -n 1)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml 파일을 저장소에서 찾을 수 없습니다."
            exit 1
          fi
          SRC_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "✅ pubspec.yaml 발견: $PUBSPEC_PATH"

          if [ -f "$SRC_DIR/lib/main.dart" ]; then
            cd "$SRC_DIR"
            [ ! -d "ios" ] && flutter create --org com.studynote --platforms=ios .
          else
            BUILD_DIR="$GITHUB_WORKSPACE/__build_ios_app"
            rm -rf "$BUILD_DIR"
            flutter create --org com.studynote --platforms=ios "$BUILD_DIR"
            cp -f "$SRC_DIR/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"
            for f in main.dart adaptive_study_workspace.dart study_models.dart study_services.dart study_sync_repository.dart study_workspace_widgets.dart real_device_audio_adapter.dart; do
              [ -f "$SRC_DIR/$f" ] && cp -f "$SRC_DIR/$f" "$BUILD_DIR/lib/$f"
            done
            if [ -f "$SRC_DIR/AppDelegate.swift" ]; then
              cp -f "$SRC_DIR/AppDelegate.swift" "$BUILD_DIR/ios/Runner/AppDelegate.swift"
            fi
            cd "$BUILD_DIR"
          fi

          python3 - << 'PYEOF'
          import glob, os

          def repair_dart(code):
              out = []
              i, n, fixes = 0, len(code), 0
              while i < n:
                  ch = code[i]
                  if code[i:i+2] == '//':
                      end = code.find('\n', i)
                      if end == -1:
                          out.append(code[i:]); break
                      out.append(code[i:end+1]); i = end + 1; continue
                  if code[i:i+2] == '/*':
                      end = code.find('*/', i + 2)
                      if end == -1:
                          out.append(code[i:]); break
                      out.append(code[i:end+2]); i = end + 2; continue
                  if ch == 'r' and i + 1 < n and code[i+1] in ("'", '"'):
                      q = code[i+1]
                      if code[i+1:i+4] == q * 3:
                          end = code.find(q * 3, i + 4)
                          if end == -1:
                              out.append(code[i:]); break
                          out.append(code[i:end+3]); i = end + 3; continue
                      out.append('r' + q); i += 2
                      while i < n and code[i] != q:
                          if code[i] == '\r' and i + 1 < n and code[i+1] == '\n':
                              out.append('\\n'); fixes += 1; i += 2
                          elif code[i] == '\n':
                              out.append('\\n'); fixes += 1; i += 1
                          else:
                              out.append(code[i]); i += 1
                      if i < n:
                          out.append(code[i]); i += 1
                      continue
                  if code[i:i+3] in ("'''", '"""'):
                      q3 = code[i:i+3]; out.append(q3); i += 3
                      while i < n and code[i:i+3] != q3:
                          if code[i] == '\\' and i + 1 < n:
                              out.append(code[i:i+2]); i += 2
                          else:
                              out.append(code[i]); i += 1
                      if i < n:
                          out.append(q3); i += 3
                      continue
                  if ch in ("'", '"'):
                      q = ch; out.append(q); i += 1; interp = 0
                      while i < n:
                          if code[i] == '\\' and i + 1 < n:
                              out.append(code[i:i+2]); i += 2; continue
                          if code[i:i+2] == '${':
                              interp += 1; out.append('${'); i += 2; continue
                          if interp > 0:
                              if code[i] == '{': interp += 1
                              elif code[i] == '}': interp -= 1
                              out.append(code[i]); i += 1; continue
                          if code[i] == q:
                              out.append(q); i += 1; break
                          if code[i] == '\r' and i + 1 < n and code[i+1] == '\n':
                              out.append('\\n'); fixes += 1; i += 2; continue
                          if code[i] == '\n':
                              out.append('\\n'); fixes += 1; i += 1; continue
                          out.append(code[i]); i += 1
                      continue
                  out.append(ch); i += 1
              return ''.join(out), fixes

          for path in glob.glob('lib/**/*.dart', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  src = f.read()
              fixed, cnt = repair_dart(src)
              imp_fixed = fixed.replace(
                  'package:syncfusion_flutter_pdfviewer/syncfusion_flutter_pdfviewer.dart',
                  'package:syncfusion_flutter_pdfviewer/pdfviewer.dart',
              )
              if cnt > 0 or imp_fixed != fixed:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(imp_fixed)
                  print(f"🔧 자동 복구 완료: {path} (줄바꿈 {cnt}곳, pdfviewer import 교정={imp_fixed != fixed})")
          PYEOF

          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '강의 음성을 녹음하고 필기 타임스탬프와 동기화하기 위해 마이크 권한이 필요합니다.'" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCalendarsFullAccessUsageDescription string 'AI 스터디 플래너 일정을 캘린더에 등록하기 위해 권한이 필요합니다.'" ios/Runner/Info.plist 2>/dev/null || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 1[1234]\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

          flutter pub get
          flutter build ios --release --no-codesign --config-only

          if [ -f "ios/Podfile" ]; then
            sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" ios/Podfile || true
            sed -i '' "s/platform :ios, '1[1234]\.0'/platform :ios, '15.0'/g" ios/Podfile || true
            (cd ios && pod install) || true
          fi

          if [ -d "ios/Runner.xcworkspace" ]; then
            xcodebuild build \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/ios_derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
          else
            xcodebuild build \
              -project ios/Runner.xcodeproj \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/ios_derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
          fi

          APP_PATH="$(find build/ios_derived -name 'Runner.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app 빌드 결과물을 찾지 못했습니다."
            exit 1
          fi
          echo "✅ Runner.app 생성 완료: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/StudyNote_iPad_Sideloadly.ipa" Payload
      - name: Upload iPad IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-iPad-IPA-설치파일(Sideloadly용)
          path: StudyNote_iPad_Sideloadly.ipa
